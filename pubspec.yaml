name: tvlauncher
description: Flutter-based Android TV launcher.

version: 1.0.0+2

environment:
  sdk: ^3.13.5
  flutter: 3.47.6

dependencies:
  flutter:
    sdk: flutter

  clock: ^1.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  drift: ^2.5.0
  path_provider: ^2.0.13
  package_info_plus: ^10.2.2
  provider: ^6.0.5
  path: ^1.9.1
  path_provider_platform_interface: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.3.3
  lints: ^6.1.0
  mockito: ^5.3.2
  drift_dev: ^2.5.2
  network_image_mock: ^2.1.1
  transparent_image: ^2.0.1
  plugin_platform_interface: ^2.1.8
  package_info_plus_platform_interface: ^4.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  shaders:
    - shaders/diamonds.frag
    - shaders/diamond_light.frag
  fonts:
    - family: SourceSans3
      fonts:
        - asset: fonts/SourceSans3-Regular.ttf
        - asset: fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: fonts/SourceSans3-SemiBold.ttf
          weight: 600
